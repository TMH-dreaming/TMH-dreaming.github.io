<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Sign Up</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"  integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body class="container flex-column position-absolute top-50 start-50 translate-middle d-flex">
    <div class="nav nav-tabs" id="nav-tab" role="tablist">
        <button class="nav-link active" id="nav-login-tab" data-bs-toggle="tab" data-bs-target="#nav-login" type="button" role="tab" aria-controls="nav-login" aria-selected="true">Log In</button>
        <button class="nav-link" id="nav-signup-tab" data-bs-toggle="tab" data-bs-target="#nav-signup" type="button" role="tab" aria-controls="nav-signup" aria-selected="false">Sign Up</button>
    </div>
    <main class="d-flex align-items-center justify-content-center">
        <section id="forms">
        <div class="tab-content" id="nav-tabContent">
            <!--login-->
            <div class="tab-pane fade show active" id="nav-login" role="tabpanel" aria-labelledby="nav-login-tab" tabindex="0">
                <form class="form-signin">
                    <i class="fas fa-brain logo-login"></i>
                    <h1 class="mb-3 font-weight-normal">Log in</h1>
                    <input type="email" id="inputEmail" class="form-control" placeholder="Email" required autofocus>
                    <input type="password" id="inputPassword" class="form-control" placeholder="Password" required>
                    <div class="checkbox mb-3">
                      <label>
                        <input type="checkbox" value="remember-me"> Remember me
                      </label>
                    </div>
                  </form>
                  <a class="btn btn-lg btn-block btn-login-brain" href="landing.html">Log in</a>
            </div>


            <!--signup-->
            <div class="tab-pane fade" id="nav-signup" role="tabpanel" aria-labelledby="nav-signup-tab" tabindex="0">
                <form class="form-signin">
                    <i class="fas fa-brain logo-login"></i>
                    <h1 class="mb-3 font-weight-normal">Register</h1>
                    <input type="name" id="inputFName" class="form-control" placeholder="First Name" required autofocus>
                    <input type="lName" id="inputLName" class="form-control" placeholder="Last Name" required autofocus>
                    Gender:
                    <div class="btn-group d-flex flex-wrap column-gap-3" role="group" aria-label="Gender">
                        
                        <div><input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1" checked>
                        <label  for="btnradio1">Male</label></div>
                        
                        <div><input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2" autocomplete="off">
                        <label  for="btnradio2">Female</label></div>
                        

                        <div><input class="form-check-input" type="radio" name="radioDefault" id="radioDefault3" autocomplete="off">
                        <label  for="btnradio3">Rather not Say</label></div>
                      </div>
                    
                    <input type="email" id="inputEmail" class="form-control" placeholder="Email" required autofocus>
                    <input type="password" id="inputPassword" class="form-control" placeholder="Password" required>
                    <input type="password" id="reinputPassword" class="form-control" placeholder="Re-enter Password" required>
                    <div class="checkbox mb-3">
                      <label>
                        <input type="checkbox" value="accept-terms" required> Accept the Terms and Conditions
                      </label>
                    </div>
                    <a class="btn btn-lg btn-block btn-login-brain" type="submit" href="landing.html">Sign Up</a>
                    
                  </form>
            </div>
          </div>
    </section>    
    </main>
    



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
