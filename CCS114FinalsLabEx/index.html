<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Tracker</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <main>
       <h1>Student Grade Tracker</h1> 
       <div>
        <button id="btnAdd">Add Student</button>
        <button id="btnDel">Remove Last Student</button>
       </div>
       <div class="tables">
        <div class="crd">
            <h3>Names</h3>
            <div id="stuName">

            </div>
        </div>
        <div class="crd">
            <h3>Grades</h3>
            <div id="stuGrd">

            </div>
        </div>
        <div class="crd">
            <h3>Remarks</h3>
            <div id="stuRem">

            </div>
        </div>
       </div>
       
       
    </main>

    <script src="script.js"></script>
</body>
</html>
